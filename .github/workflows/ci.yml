# Principle 4: automated tests before declaring completion. Runs on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      VX_TEST_DATABASE_URL: postgresql+psycopg://vittasynx:ci-only-password@localhost:5432/vittasynx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Create non-superuser app role (RLS must not be bypassable)
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE vittasynx LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE DATABASE vittasynx_test OWNER vittasynx;"
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Migrations round-trip and drift check
        working-directory: backend
        env:
          VX_ENVIRONMENT: test
          VX_DATABASE_URL: ${{ env.VX_TEST_DATABASE_URL }}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      VX_ENVIRONMENT: development
      VX_DATABASE_URL: postgresql+psycopg://vittasynx:ci-only-password@localhost:5432/vittasynx
      VX_REQUIRE_MFA_FOR_PRIVILEGED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Database
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE vittasynx LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE DATABASE vittasynx OWNER vittasynx;"
      - name: Install
        run: |
          pip install -r backend/requirements-dev.txt
          python -m playwright install --with-deps chromium
          cd frontend && npm ci && npx next build
      - name: Start servers
        run: |
          cd backend && alembic upgrade head && (uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &)
          cd ../frontend && (npx next start -p 3000 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 2; done
      - name: Smoke test
        run: python e2e/smoke_test.py
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/screenshots/
            /tmp/api.log
            /tmp/web.log
